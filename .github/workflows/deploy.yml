name: Deploy to VDS

# TD-021: до этого деплой был полностью ручным, а README описывал workflow,
# которых в репозитории никогда не существовало. Из-за этого смерженная задача
# могла неделями считаться развёрнутой, не работая у пользователя (так вышло с
# ТП-208). Запуск ТОЛЬКО ручной: выкладка на прод не должна происходить сама по
# себе от каждого коммита в main.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Что выкатываем
        type: choice
        required: true
        default: both
        options: [both, backend, frontend]

concurrency:
  # Два одновременных деплоя на один сервер — гарантированный конфликт.
  group: deploy-vds
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      # sshpass читает пароль из этой переменной — он не попадает ни в
      # командную строку (её видно в `ps` на раннере), ни в лог (GitHub
      # маскирует значения секретов).
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Доступ к серверу — ключом ИЛИ паролем. Ключ предпочтительнее: его
      # отзывают удалением строки в authorized_keys, не трогая учётную запись.
      # Пароль поддержан как рабочий путь для тех, у кого ключа нет.
      - name: Проверить наличие доступа
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$SERVER_IP" ] && missing="$missing SERVER_IP"
          [ -z "$SERVER_USER" ] && missing="$missing SERVER_USER"
          if [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$SSHPASS" ]; then
            missing="$missing (SSH_PRIVATE_KEY или SERVER_PASSWORD)"
          fi
          if [ -n "$missing" ]; then
            echo "Не заданы секреты репозитория:$missing"
            echo "Settings → Secrets and variables → Actions"
            exit 1
          fi

      # Способ подключения выбирается один раз и дальше используется всеми
      # шагами через $SSH/$SCP — иначе ветвление размазалось бы по каждому.
      - name: Настроить доступ к серверу
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            echo "Доступ по ключу"
            echo "SSH=ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes" >> "$GITHUB_ENV"
            echo "SCP=scp -i $HOME/.ssh/id_deploy -o BatchMode=yes" >> "$GITHUB_ENV"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            echo "Доступ по паролю"
            # Пароль, вставленный в интерактивный запрос `gh secret set`,
            # почти всегда приезжает с хвостовым переводом строки, и сервер
            # такой пароль отвергает (`Permission denied`, sshpass exit 5) —
            # диагностировать это по логу невозможно, значение маскировано.
            # Обёртка нормализует пароль в момент запуска, не копируя его
            # в GITHUB_ENV и не подставляя в argv (там его видно в `ps`).
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'export SSHPASS="$(printf %s "$SSHPASS" | tr -d "\r\n")"' \
              'exec sshpass -e "$@"' > "$HOME/.ssh/wrap"
            chmod +x "$HOME/.ssh/wrap"
            # PubkeyAuthentication=no — иначе ssh сначала перебирает ключи
            # раннера и может упереться в лимит попыток до пароля.
            echo "SSH=$HOME/.ssh/wrap ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password" >> "$GITHUB_ENV"
            echo "SCP=$HOME/.ssh/wrap scp -o PubkeyAuthentication=no -o PreferredAuthentications=password" >> "$GITHUB_ENV"
          fi

      # Бэкенд собирается ВНУТРИ образа (многоэтапный backend/Dockerfile,
      # TD-023), поэтому здесь достаточно обновить код и пересобрать образ.
      - name: Выкатить backend
        if: ${{ inputs.target == 'both' || inputs.target == 'backend' }}
        run: |
          $SSH "$SERVER_USER@$SERVER_IP" \
            'cd ${{ vars.DEPLOY_DIR || '/opt/workhelper' }} \
             && git fetch origin main && git checkout main && git pull --ff-only \
             && docker compose -f docker-compose.vds.yml up -d --build backend'

      - name: Дождаться готовности backend
        if: ${{ inputs.target == 'both' || inputs.target == 'backend' }}
        run: |
          for i in $(seq 1 40); do
            status=$($SSH "$SERVER_USER@$SERVER_IP" \
              "docker ps --filter name=workhelper-backend-1 --format '{{.Status}}'")
            echo "$status"
            case "$status" in *healthy*) exit 0 ;; esac
            sleep 15
          done
          echo "Контейнер не стал healthy — проверьте логи на сервере"
          exit 1

      - name: Set up Node
        if: ${{ inputs.target == 'both' || inputs.target == 'frontend' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # VITE_API_BASE_URL намеренно НЕ задаётся: дефолт относительный, фронтенд
      # ходит на тот же origin (TD-024). VITE_SENTRY_DSN — публичный ключ
      # GlitchTip, обязательно БЕЗ дефисов (TD-025), хранится в variables.
      - name: Собрать frontend
        if: ${{ inputs.target == 'both' || inputs.target == 'frontend' }}
        working-directory: frontend
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          npm ci
          npm run build

      - name: Выложить frontend
        if: ${{ inputs.target == 'both' || inputs.target == 'frontend' }}
        run: |
          tar -czf dist.tar.gz -C frontend/dist .
          $SCP dist.tar.gz "$SERVER_USER@$SERVER_IP:/tmp/wt-dist.tar.gz"
          $SSH "$SERVER_USER@$SERVER_IP" \
            'set -e
             root=${{ vars.WEB_ROOT || '/var/www/workhelper' }}
             tmp=$(mktemp -d)
             tar -xzf /tmp/wt-dist.tar.gz -C "$tmp"
             # Распаковка во временный каталог и подмена: сайт не остаётся
             # пустым, если распаковка оборвётся на полпути.
             rm -rf "$root".old && cp -r "$root" "$root".old
             rm -rf "$root"/* && cp -r "$tmp"/. "$root"/
             rm -rf "$tmp" /tmp/wt-dist.tar.gz'

      - name: Проверить, что сайт отвечает
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.PUBLIC_URL || 'wowoffcata.hlab.kz' }}/")
          echo "HTTP $code"
          [ "$code" = "200" ]

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/id_deploy
