name: Deploy to VDS

# TD-021: до этого деплой был полностью ручным, а README описывал workflow,
# которых в репозитории никогда не существовало. Из-за этого смерженная задача
# могла неделями считаться развёрнутой, не работая у пользователя (так вышло с
# ТП-208). Запуск ТОЛЬКО ручной: выкладка на прод не должна происходить сама по
# себе от каждого коммита в main.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Что выкатываем
        type: choice
        required: true
        default: both
        options: [both, backend, frontend]

concurrency:
  # Два одновременных деплоя на один сервер — гарантированный конфликт.
  group: deploy-vds
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      # sshpass читает пароль из этой переменной — он не попадает ни в
      # командную строку (её видно в `ps` на раннере), ни в лог (GitHub
      # маскирует значения секретов).
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Доступ к серверу — ключом ИЛИ паролем. Ключ предпочтительнее: его
      # отзывают удалением строки в authorized_keys, не трогая учётную запись.
      # Пароль поддержан как рабочий путь для тех, у кого ключа нет.
      - name: Проверить наличие доступа
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$SERVER_IP" ] && missing="$missing SERVER_IP"
          [ -z "$SERVER_USER" ] && missing="$missing SERVER_USER"
          if [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$SSHPASS" ]; then
            missing="$missing (SSH_PRIVATE_KEY или SERVER_PASSWORD)"
          fi
          if [ -n "$missing" ]; then
            echo "Не заданы секреты репозитория:$missing"
            echo "Settings → Secrets and variables → Actions"
            exit 1
          fi

      # Способ подключения выбирается один раз и дальше используется всеми
      # шагами через $SSH/$SCP — иначе ветвление размазалось бы по каждому.
      - name: Настроить доступ к серверу
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            echo "Доступ по ключу"
            echo "SSH=ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes" >> "$GITHUB_ENV"
            echo "SCP=scp -i $HOME/.ssh/id_deploy -o BatchMode=yes" >> "$GITHUB_ENV"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            echo "Доступ по паролю"
            # Пароль, вставленный в интерактивный запрос `gh secret set`,
            # почти всегда приезжает с хвостовым переводом строки, и сервер
            # такой пароль отвергает (`Permission denied`, sshpass exit 5) —
            # диагностировать это по логу невозможно, значение маскировано.
            # Обёртка нормализует пароль в момент запуска, не копируя его
            # в GITHUB_ENV и не подставляя в argv (там его видно в `ps`).
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'export SSHPASS="$(printf %s "$SSHPASS" | tr -d "\r\n")"' \
              'exec sshpass -e "$@"' > "$HOME/.ssh/wrap"
            chmod +x "$HOME/.ssh/wrap"
            # PubkeyAuthentication=no — иначе ssh сначала перебирает ключи
            # раннера и может упереться в лимит попыток до пароля.
            # keyboard-interactive обязателен: многие серверы (в т.ч. дефолт
            # Ubuntu с PAM) принимают пароль ТОЛЬКО этим методом, и запрос
            # с одним `password` отклоняется — хотя тот же пароль руками
            # проходит. Симптом неотличим от неверного пароля.
            AUTH="-o PubkeyAuthentication=no -o PreferredAuthentications=keyboard-interactive,password -o NumberOfPasswordPrompts=1"
            echo "SSH=$HOME/.ssh/wrap ssh $AUTH" >> "$GITHUB_ENV"
            echo "SCP=$HOME/.ssh/wrap scp $AUTH" >> "$GITHUB_ENV"
          fi

      # Бэкенд собирается ВНУТРИ образа (многоэтапный backend/Dockerfile,
      # TD-023), поэтому на сервере достаточно обновить код и пересобрать образ.
      # Проверка «на сервере тот самый коммит» стоит ДО сборки: собирать не тот
      # код и потом убеждаться, что «контейнер поднялся», — бессмысленно.
      # Шаг безусловный: checkout на сервере — общая опора не только для сборки
      # backend, но и для infra-скриптов (docker-compose.vds.yml, apply-nginx-*).
      # При target=frontend он раньше пропускался, и шаг с nginx падал на
      # «No such file or directory» — скрипт лежит в репозитории, которого на
      # сервере ещё нет. Заодно и для выкладки одного фронтенда проверяется,
      # что на сервере тот коммит, который выкатывают.
      - name: Обновить код на сервере
        run: |
          $SSH "$SERVER_USER@$SERVER_IP" "
            set -e
            cd ${{ vars.DEPLOY_DIR || '/opt/workhelper' }}
            git fetch origin main
            git checkout main
            git pull --ff-only
            echo \"Коммит на сервере: \$(git rev-parse HEAD)\"
            if ! git merge-base --is-ancestor ${{ github.sha }} HEAD; then
              echo 'Выкатываемого коммита ${{ github.sha }} на сервере нет — собрался бы другой код'
              exit 1
            fi
          "
          # T-305: сверять версию образа нужно именно с коммитом НА СЕРВЕРЕ, а
          # не с github.sha: проверка выше намеренно допускает, что сервер ушёл
          # вперёд, и строгое равенство давало бы ложные падения.
          SERVER_SHA=$($SSH "$SERVER_USER@$SERVER_IP" \
            "cd ${{ vars.DEPLOY_DIR || '/opt/workhelper' }} && git rev-parse HEAD" | tr -d '\r')
          echo "SERVER_SHA=$SERVER_SHA" >> "$GITHUB_ENV"

      - name: Пересобрать и перезапустить backend
        if: ${{ inputs.target == 'both' || inputs.target == 'backend' }}
        run: |
          $SSH "$SERVER_USER@$SERVER_IP" \
            "cd ${{ vars.DEPLOY_DIR || '/opt/workhelper' }} \
             && APP_VERSION=$SERVER_SHA docker compose -f docker-compose.vds.yml up -d --build backend"

      # TD-029: прежняя проверка читала `docker ps --format {{.Status}}` и
      # сравнивала по подстроке — `case "$status" in *healthy*)`. Строка
      # «Up 2 minutes (unhealthy)» содержит `healthy`, то есть гейт принимал
      # НЕЗДОРОВЫЙ контейнер за здоровый. Статус читается точным значением.
      - name: Дождаться готовности backend
        if: ${{ inputs.target == 'both' || inputs.target == 'backend' }}
        run: |
          for i in $(seq 1 40); do
            status=$($SSH "$SERVER_USER@$SERVER_IP" \
              "docker inspect --format '{{.State.Health.Status}}' workhelper-backend-1" \
              2>/dev/null || true)
            status=$(printf %s "$status" | tr -d '\r')
            echo "healthcheck: ${status:-контейнера ещё нет}"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Backend не подтвердил работоспособность за 10 минут."
          echo "Последний статус: ${status:-контейнера нет}. Логи: docker logs workhelper-backend-1"
          exit 1

      # T-305: «контейнер жив» и «работает НОВЫЙ код» — разные утверждения.
      # Раньше второе доказать было нечем: в образе версия вырождалась в
      # «0.0.1-», потому что .git не попадает в контекст сборки. Теперь образ
      # несёт коммит, и гейт сверяет его с тем, что лежит на сервере.
      - name: Проверить, что запущен образ из выкаченного кода
        if: ${{ inputs.target == 'both' || inputs.target == 'backend' }}
        run: |
          running=$(curl -fsS "https://${{ vars.PUBLIC_URL || 'wowoffcata.hlab.kz' }}/work-task/api/v1/health" \
            | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          echo "версия в образе: ${running:-нет поля version}"
          echo "коммит на сервере: $SERVER_SHA"
          if [ "$running" != "$SERVER_SHA" ]; then
            echo "Запущен образ, собранный не из этого кода — деплой не доехал"
            exit 1
          fi

      - name: Set up Node
        if: ${{ inputs.target == 'both' || inputs.target == 'frontend' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # VITE_API_BASE_URL намеренно НЕ задаётся: дефолт относительный, фронтенд
      # ходит на тот же origin (TD-024). VITE_SENTRY_DSN — публичный ключ
      # GlitchTip, обязательно БЕЗ дефисов (TD-025), хранится в variables.
      - name: Собрать frontend
        if: ${{ inputs.target == 'both' || inputs.target == 'frontend' }}
        working-directory: frontend
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          npm ci
          npm run build

      - name: Выложить frontend
        if: ${{ inputs.target == 'both' || inputs.target == 'frontend' }}
        run: |
          tar -czf dist.tar.gz -C frontend/dist .
          $SCP dist.tar.gz "$SERVER_USER@$SERVER_IP:/tmp/wt-dist.tar.gz"
          $SSH "$SERVER_USER@$SERVER_IP" \
            'set -e
             root=${{ vars.WEB_ROOT || '/var/www/workhelper' }}
             tmp=$(mktemp -d)
             tar -xzf /tmp/wt-dist.tar.gz -C "$tmp"
             # Распаковка во временный каталог и подмена: сайт не остаётся
             # пустым, если распаковка оборвётся на полпути.
             rm -rf "$root".old && cp -r "$root" "$root".old
             rm -rf "$root"/* && cp -r "$tmp"/. "$root"/
             rm -rf "$tmp" /tmp/wt-dist.tar.gz'

      # Прежняя проверка была `curl / → 200` и не ловила ровно тот класс
      # регрессий, ради которого существует (баг «пропал бэклог», 2026-07-28):
      # статика отдаётся, экран пуст. Хуже того, nginx на VDS настроен
      # `try_files $uri $uri/ /index.html` — НЕСУЩЕСТВУЮЩИЙ /assets/*.js
      # отдаётся с кодом 200 и типом text/html (проверено на проде), поэтому
      # проверка ассетов по коду ответа не доказывает вообще ничего.
      - name: Проверить, что приложение отвечает на проде
        run: |
          base="https://${{ vars.PUBLIC_URL || 'wowoffcata.hlab.kz' }}"

          html=$(curl -fsS -H 'Cache-Control: no-cache' "$base/")
          echo "$html" | grep -q 'id="root"' \
            || { echo "На / отдаётся не index.html приложения"; exit 1; }

          assets=$(echo "$html" | grep -oE '/assets/[^"]+\.(js|css)')
          [ -n "$assets" ] \
            || { echo "index.html не ссылается ни на один ассет — выложена не сборка Vite"; exit 1; }

          for asset in $assets; do
            ctype=$(curl -fsS -o /dev/null -w '%{content_type}' "$base$asset")
            case "$ctype" in
              *javascript*|text/css*)
                echo "ассет отдаётся: $asset ($ctype)" ;;
              *)
                echo "Ассет $asset отдан как '$ctype' — на сервере его нет, nginx подставил index.html"
                exit 1 ;;
            esac
          done

          # Живой сквозной путь nginx → backend → база: 503 от /health или
          # недоступный backend роняют деплой, а не остаются незамеченными.
          health=$(curl -fsS "$base/work-task/api/v1/health") \
            || { echo "API не подтверждает работоспособность на публичном адресе"; exit 1; }
          echo "health: $health"
          echo "$health" | grep -q '"status":"UP"' \
            || { echo "Неожиданный ответ /health"; exit 1; }

      # Гейт против молчаливого «задеплоили, но не то»: сравнивается бандл,
      # собранный в этом прогоне, с тем, что реально отдаёт прод. Именно этот
      # класс отказа три недели выдавал ТП-208 за развёрнутую (TD-023).
      - name: Убедиться, что выложен свежесобранный фронтенд
        if: ${{ inputs.target == 'both' || inputs.target == 'frontend' }}
        run: |
          base="https://${{ vars.PUBLIC_URL || 'wowoffcata.hlab.kz' }}"
          built=$(grep -oE '/assets/[^"]+\.js' frontend/dist/index.html | head -1)
          [ -n "$built" ] || { echo "В собранном index.html нет ссылки на бандл"; exit 1; }
          curl -fsS -H 'Cache-Control: no-cache' "$base/" | grep -q "$built" \
            || { echo "Прод отдаёт другой бандл: ожидался $built"; exit 1; }
          echo "выложен бандл этой сборки: $built"

      # Кэш-заголовки статики (config as code). Шаг стоит ПОСЛЕ проверок
      # релиза намеренно: правка nginx не должна мешать убедиться, что
      # выложенное работает, а её собственный провал обязан быть видимым —
      # скрипт идемпотентен, при первом запуске правит конфиг, дальше no-op.
      # Он же сам откатывается, если nginx -t или проверка заголовков упали.
      - name: Применить кэш-заголовки nginx
        run: |
          $SSH "$SERVER_USER@$SERVER_IP" \
            'cd ${{ vars.DEPLOY_DIR || '/opt/workhelper' }} \
             && bash infra/apply-nginx-cache.sh'

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/id_deploy
