name: Frontend CI

on:
  push:
    branches: [ main ]
    paths: [ 'frontend/**', '.github/workflows/frontend-ci.yml' ]
  pull_request:
    paths: [ 'frontend/**', '.github/workflows/frontend-ci.yml' ]
  # T-303: уязвимость публикуется без нашего участия, поэтому сканирование
  # обязано идти и по расписанию, а не только на изменение кода. Иначе новый
  # CVE в неизменной зависимости остаётся незамеченным, пока кто-нибудь не
  # тронет модуль. Понедельник, 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Read .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # T-303: настоящий гейт, а не отчёт — находка валит сборку, как SpotBugs
      # на backend (T-104). Ослабление до предупреждения запрещено тем же
      # принципом: гейт, который не краснеет, неотличим от выключенного (W-06).
      #
      # Порог high: moderate и low в JS-экосистеме почти всегда шумят
      # транзитивными ReDoS в сборочных инструментах, и гейт на них
      # превратился бы в обряд подавления. Порог зафиксирован как решение,
      # а не как настройка «чтобы позеленело»: на момент введения фронтенд
      # имел 0 уязвимостей ЛЮБОГО уровня (TD-043), то есть выбор порога
      # ничего не скрывал.
      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
