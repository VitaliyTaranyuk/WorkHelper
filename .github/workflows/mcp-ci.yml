name: MCP CI

# T-517: у нового пакета обязан быть свой гейт. Без него код MCP-сервера попадал бы
# в main без единой проверки — K-08 требует, чтобы те же проверки проходили в CI.
on:
  push:
    branches: [ main ]
    paths: [ 'mcp/**', '.github/workflows/mcp-ci.yml' ]
  pull_request:
    paths: [ 'mcp/**', '.github/workflows/mcp-ci.yml' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v4

      - name: Read .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
