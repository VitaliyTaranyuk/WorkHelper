name: Backend CI

# Принцип фильтра (T-311): в paths входит ВСЁ, от чего зависит РЕЗУЛЬТАТ
# backend-тестов, а не только каталог backend/. Иначе гейт не срабатывает
# ровно на том изменении, которое его ломает — класс TD-029.
#
# Файлы вне backend/, которые читают тесты (проверено grep по src/test):
#   docker-compose.vds.yml + .github/workflows/deploy.yml → DeployGateContractTest (TD-029)
#   .ai/PROJECT_RULES.md                                  → ReferenceCatalogSyncTest (T-513)
#
# Реестр правил добавлен в T-311 (TD-040): ADR-023 разрешает дубль эталонного
# каталога ТОЛЬКО потому, что расхождение красит сборку, — а на PR, меняющем
# один лишь реестр, сборка не запускалась вовсе.
#
# Сам workflow тоже в списке (как в mcp-ci.yml): без этого опечатка в paths
# отключила бы проверки молча и не была бы замечена собственным прогоном.
on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', 'docker-compose.vds.yml', '.github/workflows/deploy.yml', '.ai/PROJECT_RULES.md', '.github/workflows/backend-ci.yml' ]
  pull_request:
    paths: [ 'backend/**', 'docker-compose.vds.yml', '.github/workflows/deploy.yml', '.ai/PROJECT_RULES.md', '.github/workflows/backend-ci.yml' ]
  # T-303: см. пояснение в frontend-ci.yml — CVE публикуются без изменений кода,
  # поэтому сканирование обязано идти и по расписанию.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # T-101: этой БД пользуется шаг «Run integration tests» (./gradlew integrationTest).
      # До T-101 сервис поднимался вхолостую — интеграционных тестов не было ни одного,
      # и предупреждение здесь честно об этом говорило (T-106). Теперь наличие postgres
      # в пайплайне действительно означает, что интеграционные тесты выполняются.
      #
      # Пароля у этой БД НЕТ вовсе: `POSTGRES_HOST_AUTH_METHOD: trust`. Так в
      # репозитории не остаётся ни одной учётной записи — раньше здесь стояли
      # те же логин и пароль, что в README, в локальном docker-compose и в
      # шаблоне профиля, и повторение делало их похожими на «настоящие».
      # Контейнер живёт минуты, доступен только из этого job и уничтожается
      # вместе с раннером; заводить ради него секрет GitHub значило бы просить
      # у владельца секрет там, где секрет не нужен (K-33).
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: worktask_ci
          POSTGRES_USER: worktask_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test

      # T-303: сканирование зависимостей backend. Выбран Trivy по СОБРАННОМУ jar,
      # а не OWASP dependency-check из первоначального описания задачи: последний
      # требует ключ NVD API, то есть секрет, заводить который может только
      # владелец (K-33). Gradle-lockfile в проекте отсутствует, поэтому сканеры,
      # читающие lock, зависимостей backend не увидели бы вовсе — Trivy же
      # разбирает содержимое архива и находит встроенные библиотеки.
      #
      # Гейт настоящий: exit-code 1 валит сборку (как SpotBugs, T-104).
      #
      # ignore-unfixed включён с письменной причиной, по норме config/spotbugs/
      # exclude.xml: уязвимость без выпущенного исправления не даёт действия,
      # но заблокировала бы КАЖДЫЙ merge до выхода патча у стороннего проекта.
      # Такие находки видны в выводе шага, просто не валят сборку.
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: backend/build/libs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Run tests
        run: ./gradlew test

      # T-101: интеграционные тесты против service container postgres:16.
      # До T-101 этот сервис поднимался, но им не пользовался ни один тест —
      # он был заведён авансом и три месяца работал вхолостую.
      #
      # Отдельным шагом, а не внутри `test`: у них разные предусловия. `test`
      # обязан проходить на машине без БД, `integrationTest` без БД
      # осмысленно упасть, а не позеленеть на пустом множестве.
      - name: Run integration tests
        run: ./gradlew integrationTest
        env:
          IT_DB_URL: jdbc:postgresql://localhost:5432/worktask_ci
          IT_DB_USER: worktask_ci
          # Пусто намеренно: у контейнера аутентификация trust, пароля нет.
          IT_DB_PASSWORD: ""
