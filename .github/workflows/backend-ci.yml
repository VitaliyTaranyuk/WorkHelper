name: Backend CI

# Принцип фильтра (T-311): в paths входит ВСЁ, от чего зависит РЕЗУЛЬТАТ
# backend-тестов, а не только каталог backend/. Иначе гейт не срабатывает
# ровно на том изменении, которое его ломает — класс TD-029.
#
# Файлы вне backend/, которые читают тесты (проверено grep по src/test):
#   docker-compose.vds.yml + .github/workflows/deploy.yml → DeployGateContractTest (TD-029)
#   .ai/PROJECT_RULES.md                                  → ReferenceCatalogSyncTest (T-513)
#
# Реестр правил добавлен в T-311 (TD-040): ADR-023 разрешает дубль эталонного
# каталога ТОЛЬКО потому, что расхождение красит сборку, — а на PR, меняющем
# один лишь реестр, сборка не запускалась вовсе.
#
# Сам workflow тоже в списке (как в mcp-ci.yml): без этого опечатка в paths
# отключила бы проверки молча и не была бы замечена собственным прогоном.
on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', 'docker-compose.vds.yml', '.github/workflows/deploy.yml', '.ai/PROJECT_RULES.md', '.github/workflows/backend-ci.yml' ]
  pull_request:
    paths: [ 'backend/**', 'docker-compose.vds.yml', '.github/workflows/deploy.yml', '.ai/PROJECT_RULES.md', '.github/workflows/backend-ci.yml' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # ВНИМАНИЕ (T-106): этой БД не пользуется ни один тест — интеграционных тестов
      # (@SpringBootTest / Testcontainers) в проекте нет ни одного, все 23 тестовых
      # класса изолированы. Сервис заведён авансом под T-101; наличие postgres в
      # пайплайне НЕ означает, что интеграционные тесты выполняются.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydb
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: 1234566
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test
