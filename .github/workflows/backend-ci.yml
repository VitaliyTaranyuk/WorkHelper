name: Backend CI

# docker-compose.vds.yml и deploy.yml перечислены наравне с кодом: их
# согласованность с backend проверяет DeployGateContractTest (TD-029), и
# правка гейта деплоя без прогона тестов прошла бы мимо этой проверки.
on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', 'docker-compose.vds.yml', '.github/workflows/deploy.yml' ]
  pull_request:
    paths: [ 'backend/**', 'docker-compose.vds.yml', '.github/workflows/deploy.yml' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # ВНИМАНИЕ (T-106): этой БД не пользуется ни один тест — интеграционных тестов
      # (@SpringBootTest / Testcontainers) в проекте нет ни одного, все 23 тестовых
      # класса изолированы. Сервис заведён авансом под T-101; наличие postgres в
      # пайплайне НЕ означает, что интеграционные тесты выполняются.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydb
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: 1234566
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test
