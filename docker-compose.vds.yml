services:
  backend:
    build:
      context: ./backend
      args:
        # T-305: коммит, из которого собран образ. Подставляет деплой
        # (APP_VERSION=<sha на сервере>); при ручной сборке остаётся unknown.
        APP_VERSION: "${APP_VERSION:-unknown}"
    image: work-task-backend
    env_file: .env.vds
    ports:
      - "127.0.0.1:8080:8080"
      # T-301: порт метрик (Spring Actuator, /actuator/metrics). Публикуется
      # ТОЛЬКО на loopback — из интернета он недостижим, читать его можно с
      # самого сервера (владелец по SSH и шаг деплоя). nginx на него не смотрит
      # ни одной локацией: публично проксируются только /work-task/ и
      # /work-task/ws/ на 8080.
      - "127.0.0.1:8081:8081"
    volumes:
      - /var/lib/workhelper/attachments:/var/lib/workhelper/attachments
    restart: unless-stopped
    # T-301: единственный канал логов на VDS — `docker logs`, а драйвер
    # json-file по умолчанию не ограничен ничем: лог рос бы до заполнения
    # диска, и первым бы об этом узнала база. Потолок 30 МБ на контейнер.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # TD-029: раньше здесь был `curl -s` (без -f) по POST-эндпоинту /auth/login.
    # GET на него отдаёт 405, а без -f curl успешен на ЛЮБОМ ответе, включая
    # 500 — контейнер объявлялся healthy, если Spring отвечал хоть чем-нибудь,
    # и гейт деплоя выдавал сломанный релиз за выложенный (W-06). Теперь -f
    # (как у glitchtip ниже) и реальный GET-эндпоинт, который ходит в базу:
    # путь сверяется с HealthController.PATH тестом DeployGateContractTest.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/work-task/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ТП-175: self-hosted мониторинг клиентских ошибок (GlitchTip, Sentry-протокол).
  # Данные ошибок не покидают VDS; фронтенд шлёт события через nginx-локацию
  # /api/N/envelope/ (см. infra/apply-nginx-glitchtip.sh), UI — на :8443.
  # Секреты в .env.glitchtip генерирует infra/glitchtip/ensure-env.sh при деплое.
  glitchtip-postgres:
    image: postgres:17-alpine
    container_name: glitchtip-postgres
    env_file: .env.glitchtip
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 30s
      timeout: 5s
      retries: 5

  glitchtip-redis:
    image: valkey/valkey:8-alpine
    container_name: glitchtip-redis
    restart: unless-stopped
    mem_limit: 64m

  glitchtip-web:
    image: glitchtip/glitchtip:6.2
    container_name: glitchtip-web
    env_file: .env.glitchtip
    ports:
      - "127.0.0.1:8090:8000"
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/_health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  glitchtip-worker:
    image: glitchtip/glitchtip:6.2
    container_name: glitchtip-worker
    command: ./bin/run-celery-with-beat.sh
    env_file: .env.glitchtip
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    restart: unless-stopped
    mem_limit: 512m

  glitchtip-migrate:
    image: glitchtip/glitchtip:6.2
    container_name: glitchtip-migrate
    command: ./bin/run-migrate.sh
    env_file: .env.glitchtip
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    restart: "no"

volumes:
  glitchtip-pg-data:
