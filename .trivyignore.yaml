# Исключения гейта Trivy (T-303, TD-044).
#
# НОРМА: каждое исключение — с письменной причиной, как в
# backend/config/spotbugs/exclude.xml. «Заглушить, чтобы позеленело» запрещено
# (K-40). Здесь причина у всех одна и проверяемая: ИСПРАВЛЕННОЙ ВЕРСИИ НЕ
# СУЩЕСТВУЕТ на Maven Central — не «мы не хотим обновляться», а «обновляться
# не на что».
#
# Проверено 2026-08-07 запросами к Maven Central:
#   spring-security   последняя 6.5.1  — advisory требует 6.5.4 / 6.5.9
#   spring-framework  последняя 6.2.8  — advisory требует 6.2.11 / 6.2.19
#   spring-boot       последняя 3.5.3  — advisory требует 3.5.14
#   spring-data-commons последняя 3.5.1 — advisory требует 3.5.12
#   postgresql        последняя 42.7.7 — advisory требует 42.7.11 / 42.7.12
#   jackson-databind  последняя 2.19.0 — advisory требует 2.18.8 / 2.21.4
#
# Что УЖЕ сделано и потому здесь не перечислено: Spring Boot поднят 3.4.0 -> 3.5.3
# (закрыт CRITICAL CVE-2025-41232 — обход авторизации method security), tomcat-embed
# поднят до 10.1.55 явной управляемой версией (закрыт CRITICAL CVE-2026-41293 и ещё
# восемь Tomcat-CVE).
#
# ДАТА ИСТЕЧЕНИЯ обязательна: без неё исключение молча становится вечным, и гейт
# перестаёт отличать «ещё не выпустили патч» от «забыли обновиться». По истечении
# сборка снова покраснеет — это и есть напоминание пересмотреть список.

vulnerabilities:
  - id: CVE-2026-22732
    statement: "spring-security-web: обход политики безопасности. Требует 6.5.9 или 7.0.4 — на Maven Central последняя 6.5.1 (проверено 2026-08-07). Обновляться не на что."
    expired_at: 2026-09-07

  - id: CVE-2025-41248
    statement: "spring-security-core: обход авторизации. Требует 6.4.10 или 6.5.4 — последняя опубликованная 6.5.1. Смягчается W-04: бизнес-доступ решается в сервисе через CheckerUtil, а не только аннотациями."
    expired_at: 2026-09-07

  - id: CVE-2025-41249
    statement: "spring-core: Annotation Detection Vulnerability. Требует 6.2.11 — последняя опубликованная 6.2.8."
    expired_at: 2026-09-07

  - id: CVE-2026-41850
    statement: "spring-expression: DoS через специально сформированные SpEL-выражения. Требует 6.2.19 — последняя 6.2.8. Приложение не принимает SpEL от пользователя."
    expired_at: 2026-09-07

  - id: CVE-2026-41842
    statement: "spring-webmvc: DoS при разрешении статических ресурсов. Исправленной версии для ветки 6.2 не опубликовано."
    expired_at: 2026-09-07

  - id: CVE-2026-41845
    statement: "spring-webmvc: XSS через неверное экранирование JavaScript. Исправленной версии для ветки 6.2 не опубликовано. Фронтенд — SPA, серверных шаблонов приложение не рендерит."
    expired_at: 2026-09-07

  - id: CVE-2026-40973
    statement: "spring-boot: session hijacking через предсказуемое значение. Требует 3.5.14 — последняя опубликованная 3.5.3."
    expired_at: 2026-09-07

  - id: CVE-2026-41695
    statement: "spring-data-commons: DoS через сформированное имя свойства. Требует 3.5.12 — последняя опубликованная 3.5.1."
    expired_at: 2026-09-07

  - id: CVE-2026-42198
    statement: "postgresql JDBC: требует 42.7.11 — последняя опубликованная 42.7.7, она же установленная."
    expired_at: 2026-09-07

  - id: CVE-2026-54291
    statement: "postgresql JDBC: требует 42.7.12 — последняя опубликованная 42.7.7."
    expired_at: 2026-09-07

  - id: CVE-2026-54512
    statement: "jackson-databind: требует 2.18.8 / 2.21.4 / 3.1.4 — ни одна из веток не опубликована, последняя доступная 2.19.0 и в списке исправленных её нет."
    expired_at: 2026-09-07

  - id: CVE-2026-54513
    statement: "jackson-databind: то же, что CVE-2026-54512 — исправленной версии не опубликовано."
    expired_at: 2026-09-07
