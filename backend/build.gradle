import java.text.SimpleDateFormat

plugins {
    id 'java'
    // TD-044: 3.4.0 -> 3.5.3 (последняя опубликованная на момент 2026-08-07).
    // Обновление вызвано не гигиеной версий, а двумя CRITICAL-уязвимостями
    // обхода авторизации в Spring Security, найденными первым же прогоном Trivy.
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.liquibase.gradle' version '2.2.0'
    id 'com.github.spotbugs' version '6.0.26'
}

ext {
    gitVersion = 'git rev-parse --short HEAD'.execute().text.trim()
    buildTime = new SimpleDateFormat("yyyyMMdd-HHmmss").format(new Date())
    appVersion = "0.0.1-${gitVersion}"

    // TD-044: Spring Boot 3.5.3 приносит tomcat-embed 10.1.42, в котором
    // CRITICAL CVE-2026-41293 и ещё восемь CVE. Исправленная 10.1.55
    // опубликована, а Boot-релиза с ней ещё нет — поднимаем управляемую
    // версию явно. Это штатный механизм spring-boot-gradle-plugin, а не
    // обход: BOM продолжает управлять остальными зависимостями.
    // Убрать, когда Boot начнёт приносить >= 10.1.55 сам.
    set('tomcat.version', '10.1.55')

    // T-301: Spring Boot 3.5.3 приносит micrometer-core 1.15.1, в котором две
    // HIGH-уязвимости отказа в обслуживании — CVE-2026-40983 (gRPC) и
    // CVE-2026-40984 (HTTP-запросы). Найдены гейтом Trivy на первом же прогоне
    // PR с actuator: подключение метрик само по себе завело бы их на прод.
    // Исправление есть и опубликовано — проверено запросом к Maven Central,
    // а не по отчёту сканера (урок TD-044: «исправленной версии» может не
    // существовать). Патч в пределах 1.15.x, поведение не меняется.
    // Убрать, когда Boot начнёт приносить >= 1.15.12 сам.
    set('micrometer.version', '1.15.12')
}

version = appVersion

tasks.named('bootJar') {
    archiveBaseName.set("WorkTask")
    archiveVersion.set(appVersion)
}

tasks.named('jar') {
    enabled = false
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    liquibaseRuntime
}

repositories {
    mavenCentral()
}

configurations {
    liquibaseRuntime
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // T-301: метрики процесса (JVM, GC, пул соединений, http.server.requests).
    // Подключён РАДИ МЕТРИК: работоспособность остаётся за существующим
    // /work-task/api/v1/health (гейт деплоя и healthcheck контейнера), и
    // actuator-эндпоинт health намеренно НЕ экспонируется — второй источник
    // того же ответа неизбежно разошёлся бы с первым (K-40).
    // Слушает отдельный порт, не проксируемый nginx (см. application.yml).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation group: 'org.hibernate.validator', name: 'hibernate-validator', version: '8.0.0.Final'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-validation', version: '3.4.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    implementation 'org.liquibase:liquibase-core'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
}

/*
 * T-101: интеграционные тесты отделены от модульных ТЕГОМ, а не отдельным
 * source set. Причина — K-15 (консервативный вариант): тестовый classpath,
 * зависимости и SpotBugs-исключения остаются прежними, добавляется только
 * фильтр.
 *
 * `test` их НЕ запускает, поэтому `./gradlew test` остаётся зелёным на машине
 * без PostgreSQL — именно так весь проектный quality gate и работал до сих пор.
 * `integrationTest` запускает ТОЛЬКО их и требует живую БД.
 *
 * Тег, а не условный пропуск: тест, который сам себя выключает при недоступной
 * БД, зелёный и в том случае, когда проверять было нечем, — это молчаливый
 * отказ (W-06) и гейт, неотличимый от выключенного (урок T-104).
 */
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }

    // T-513: эталонный каталог правил порождается из `.ai/PROJECT_RULES.md` и
    // сверяется с ним на каждом прогоне (ReferenceCatalogSyncTest). Перегенерация —
    // `./gradlew test -Drules.regenerate=true --tests '*ReferenceCatalogSyncTest'`.
    // Тесты идут в форкнутой JVM, поэтому свойство нужно пробросить явно: без
    // этого флаг молча не доезжает и выглядит как «перегенерация не работает».
    if (System.getProperty('rules.regenerate') != null) {
        systemProperty 'rules.regenerate', System.getProperty('rules.regenerate')
    }
}

tasks.register('integrationTest', Test) {
    description = 'Интеграционные тесты против живого PostgreSQL (профиль test).'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'integration'
    }

    // Адрес и учётные данные БД приезжают ТОЛЬКО из окружения: в CI это
    // service container, локально — backend/enviroment/local/.env. Значений
    // по умолчанию нет намеренно — учётные данные не должны лежать в
    // репозитории даже как «локальные» (K-33). Отсутствие переменных —
    // понятная остановка, а не молчаливая попытка подключиться не туда (W-06).
    doFirst {
        if (!System.getenv('IT_DB_URL') || !System.getenv('IT_DB_USER')) {
            throw new GradleException(
                    'Не заданы IT_DB_URL и IT_DB_USER. Поднимите БД ' +
                    '(docker-compose up -d в backend/enviroment/local) и задайте переменные ' +
                    'окружения — значения возьмите из своего .env. IT_DB_PASSWORD может быть пустым, ' +
                    'если у базы нет пароля.')
        }
    }

    systemProperty 'spring.datasource.url', System.getenv('IT_DB_URL') ?: ''
    systemProperty 'spring.datasource.username', System.getenv('IT_DB_USER') ?: ''
    systemProperty 'spring.datasource.password', System.getenv('IT_DB_PASSWORD') ?: ''

    // Падение интеграционного теста почти всегда происходит при СТАРТЕ контекста,
    // а стандартный вывод Gradle печатает только тип исключения («IllegalStateException
    // at Assert.java:79») без сообщения — по такой строке причина неотличима от
    // десятка других. Полный формат экономит круг «правка → пуш → прогон CI».
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }

    shouldRunAfter tasks.named('test')
}

/*
 * T-104: статический анализ backend. SpotBugs выбран вместо Checkstyle
 * осознанно — он ищет ДЕФЕКТЫ (разыменование null, проглоченные исключения,
 * сравнение по ссылке), а не оформление. Именно на этом классе ошибок проект
 * уже горел: BUG-026 (NPE), BUG-034 (сравнение статусов по ссылке вместо id).
 *
 * Гейт настоящий: находка валит сборку. Исключения — только с письменной
 * причиной в config/spotbugs/exclude.xml; «заглушить, чтобы позеленело»
 * запрещено тем же принципом, что и правила, описывающие несуществующие
 * механизмы (K-40).
 */
spotbugs {
    ignoreFailures = false
    excludeFilter = file('config/spotbugs/exclude.xml')
}

// Тестовый код не анализируем: у него другие нормы (моки, намеренно узкие
// стабы), и шум оттуда обесценил бы гейт для основного кода.
tasks.named('spotbugsTest') {
    enabled = false
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}