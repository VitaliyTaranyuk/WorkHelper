# T-101: профиль интеграционных тестов.
#
# Имя `test` выбрано не произвольно: JwtUtils#initSecret допускает пустой
# JWT-секрет только для профилей local и test (DEV_PROFILES) и генерирует
# одноразовый. Любое другое имя потребовало бы заводить JWT_SECRET в CI —
# то есть секрет ради теста, чего K-33 не одобряет.
#
# Учётных данных здесь НЕТ и быть не должно: `spring.datasource.*` задаются
# системными свойствами из задачи integrationTest, а та берёт их только из
# окружения (IT_DB_URL / IT_DB_USER / IT_DB_PASSWORD) и без них останавливается
# с объяснением. Запуск теста из IDE в обход Gradle упадёт на отсутствии
# датасорса — это ожидаемо, гоняйте `./gradlew integrationTest`.

spring:
  jpa:
    show-sql: false
    hibernate:
      # ВАЖНО: validate, а не none. Схему создаёт Liquibase, а Hibernate
      # сверяет с ней свои маппинги при старте контекста — расхождение
      # «сущность ↔ таблица» роняет тест. Именно это TD-004 называл риском
      # («тесты могут расходиться с реальной схемой»), и до T-101 такой
      # проверки не было ни одной.
      ddl-auto: validate
  liquibase:
    enabled: true
  cors:
    allowed:
      origins: "http://localhost:3000"
      local: "http://localhost:3000"

app:
  mail:
    enable: false
  # Пусто = админ-учётки не создаются (TD-026). Интеграционный тест не должен
  # заводить пользователей с предсказуемым паролем даже во временной БД.
  bootstrap:
    admin-password: ""
  attachments:
    # AttachmentStorage в @PostConstruct создаёт этот каталог, и без переопределения
    # берёт дефолт `/var/lib/workhelper/attachments` — на раннере CI он не создаётся
    # (не root), контекст падает с AccessDeniedException ещё до подключения к БД.
    # Найдено первым же прогоном T-101 в CI. Каталог внутри build/ — его чистит
    # `gradlew clean` и не видит git.
    storage-dir: build/integration-test/attachments
