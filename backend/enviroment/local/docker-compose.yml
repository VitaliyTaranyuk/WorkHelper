version: '3'

services:
  postgres:
    # TD-020: тег зафиксирован. `postgres:latest` теперь резолвится в 18+,
    # где раскладка каталога данных несовместима с уже созданным volume —
    # локальное окружение переставало подниматься на новых машинах.
    image: postgres:16
    container_name: postgres-container
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=mydb
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=1234566

volumes:
  postgres_data:

